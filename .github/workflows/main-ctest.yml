name: main ctest gate

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: main-ctest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cuda-ctest:
    name: CUDA build + triattention/copilot-coalesce ctest
    runs-on: windows-2022
    env:
      CUDA_VERSION: "12.4"
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Resolve WDK_ROOT
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $wdk = "${{ secrets.WDK_ROOT }}"
          if (-not $wdk) {
            $wdk = "C:\Program Files (x86)\Windows Kits\10"
            Write-Host "WDK_ROOT secret unset; using default Windows Kits path"
          }
          if (Test-Path -LiteralPath $wdk) {
            "WDK_ROOT=$wdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "WDK_ROOT=$wdk"
          } else {
            Write-Host "::warning::WDK_ROOT path not found at '$wdk'. Build may fail if MSVC lacks stddef.h (see docs/LOCAL-SETUP.example.md)."
          }

      - name: Cache CUDA Toolkit
        id: cache-cuda
        uses: actions/cache@v4
        with:
          path: C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v${{ env.CUDA_VERSION }}
          key: cuda-windows-${{ env.CUDA_VERSION }}-main-ctest

      - name: Install CUDA Toolkit
        if: steps.cache-cuda.outputs.cache-hit != 'true'
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: ${{ env.CUDA_VERSION }}

      - name: Configure CUDA environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cudaPath = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v${{ env.CUDA_VERSION }}"
          if (-not (Test-Path (Join-Path $cudaPath "bin\nvcc.exe"))) {
            throw "CUDA Toolkit not found at $cudaPath"
          }
          Join-Path $cudaPath "bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CUDA_PATH=$cudaPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Ninja
        run: choco install ninja -y

      - name: Build CUDA with tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sdkArg = @()
          if ($env:WDK_ROOT) { $sdkArg = @("-SdkRoot", $env:WDK_ROOT) }
          pwsh -NoProfile -File scripts/build_cuda.ps1 -Reconfigure -WithTests @sdkArg

      - name: ctest triattention|copilot-coalesce
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ctest -R "triattention|copilot-coalesce" --test-dir build --output-on-failure -C Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }